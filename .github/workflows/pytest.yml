name: Run Pytest

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      # bigraph-schema and cdFBA are installed from git rather than PyPI:
      # this package depends on changes that are on `main` but not in either
      # latest release (the dataclass `Node` schema types, and the cdFBA
      # `Volumetric` type imported by spatial_transport.data_types).
      # Installing them *before* `pip install -e .` means pip sees those
      # requirements as already satisfied and leaves the git builds in place.
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install "bigraph-schema @ git+https://github.com/vivarium-collective/bigraph-schema@main"
        pip install "cdFBA @ git+https://github.com/vivarium-collective/cdFBA@main"
        pip install -e .

    - name: Verify bigraph-schema and cdFBA came from git
      # If a version bump ever makes pip prefer the PyPI releases, the suite
      # fails in a way that looks nothing like the cause (every test that uses
      # the `core` fixture errors at setup). Fail loudly and specifically here.
      run: |
        python - <<'EOF'
        import importlib.metadata as md
        for name in ("bigraph-schema", "cdFBA"):
            origin = md.distribution(name).read_text("direct_url.json")
            if origin is None or "git" not in origin:
                raise SystemExit(
                    f"expected a git install of {name}, got: {origin!r}")
            print(name, origin)
        EOF

    - name: Run pytest
      # `bigg` tests download models from the BiGG database, so they are left
      # out of CI to keep runs off the network. `tyssue` tests skip themselves
      # when the optional dependency is absent, and it is deliberately not
      # installed here: the version this package is developed against is a
      # fork, so the PyPI release is not known to be API-compatible.
      run: |
        pytest -m "not bigg" --cov=spatial_transport --cov-report=term
